name: CI/CD - Build, Test, Analyse, Deploy

on:
  push:
    branches:
      - test
      - preprod
      - prod

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Rendre mvnw executable
        run: chmod +x mvnw

      - name: Lancer les tests unitaires
        run: ./mvnw test -B

      - name: Analyse SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -B
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.host.url=https://sonarcloud.io

      - name: Connexion a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.IMAGE_NAME }}:${{ vars.IMAGE_TAG }}

  deploy:
    needs: build-test-analyze
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Copier docker-compose.yml sur le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/cicd/zero-to-deploy/${{ github.ref_name }}"

      - name: Deployer sur le VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/cicd/zero-to-deploy/${{ github.ref_name }}

            cat > .env <<EOF
            IMAGE_NAME=${{ vars.IMAGE_NAME }}
            IMAGE_TAG=${{ vars.IMAGE_TAG }}
            ENVIRONMENT=${{ vars.ENVIRONMENT }}
            HOST_PORT=${{ vars.HOST_PORT }}
            CONTAINER_NAME=${{ vars.CONTAINER_NAME }}
            EOF
            chmod 600 .env

            # Pull explicite de la bonne image avec le bon tag d'environnement
            docker pull ${{ vars.IMAGE_NAME }}:${{ vars.IMAGE_TAG }}

            # Lancement avec le .env explicite de cet environnement
            docker compose --env-file .env up -d --remove-orphans

            # Nettoyage cible : uniquement les anciennes images non taguees
            # DE CE DEPOT PRECIS, jamais un prune global qui toucherait
            # les autres services du VPS (gateway-service, auth-service, etc.)
            docker images "${{ vars.IMAGE_NAME }}" -q --filter "dangling=true" | xargs -r docker rmi

      - name: Verification du deploiement (healthcheck)
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://${{ secrets.VPS_HOST }}:${{ vars.HOST_PORT }}/actuator/health; then
              echo "Application prete"
              exit 0
            fi
            echo "Tentative $i/20 - pas encore prete, nouvel essai dans 10s..."
            sleep 10
          done
          echo "L'application n'a jamais repondu apres 200s"
          exit 1