name: CI/CD - Build, Test, Analyse, Deploy

on:
  push:
    branches:
      - test
      - preprod
      - prod
  pull_request:
    branches:
      - test
      - preprod
      - prod
    types: [opened, synchronize, reopened]

jobs:
  # ============================================================
  # STAGE 1 - Build & Test
  # ============================================================
  build-test:
    name: "1. Build & Test"
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && github.ref_name || '' }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Rendre mvnw executable
        run: chmod +x mvnw

      - name: Compilation et tests unitaires
        run: ./mvnw test -B

  # ============================================================
  # STAGE 2 - Analyse de code (SonarCloud)
  # ============================================================
  analyze:
    name: "2. Analyse de code"
    needs: build-test
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && github.ref_name || '' }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Rendre mvnw executable
        run: chmod +x mvnw

      - name: Analyse SonarCloud
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SONAR_OPTS="-Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
                      -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} \
                      -Dsonar.host.url=https://sonarcloud.io"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SONAR_OPTS="$SONAR_OPTS \
              -Dsonar.pullrequest.key=${{ github.event.pull_request.number }} \
              -Dsonar.pullrequest.branch=${{ github.head_ref }} \
              -Dsonar.pullrequest.base=${{ github.base_ref }}"
          fi

          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -B $SONAR_OPTS

  # ============================================================
  # STAGE 3 - Dockerisation (build multi-stage)
  # STAGE 4 - Registry (push Docker Hub)
  # ============================================================
  dockerize-and-push:
    name: "3-4. Dockerisation & Registry"
    needs: analyze
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (multi-stage) et push de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.IMAGE_NAME }}:${{ vars.IMAGE_TAG }}

  # ============================================================
  # STAGE 5 - Deploiement continu (VPS via SSH)
  # ============================================================
  deploy:
    name: "5. Deploiement"
    needs: dockerize-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Copier docker-compose.yml sur le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/cicd/zero-to-deploy/${{ github.ref_name }}"

      - name: Pull, arret/remplacement du conteneur, lancement
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/cicd/zero-to-deploy/${{ github.ref_name }}

            cat > .env <<EOF
            IMAGE_NAME=${{ vars.IMAGE_NAME }}
            IMAGE_TAG=${{ vars.IMAGE_TAG }}
            ENVIRONMENT=${{ vars.ENVIRONMENT }}
            HOST_PORT=${{ vars.HOST_PORT }}
            CONTAINER_NAME=${{ vars.CONTAINER_NAME }}
            EOF
            chmod 600 .env

            # Pull de la nouvelle image
            docker pull ${{ vars.IMAGE_NAME }}:${{ vars.IMAGE_TAG }}

            # Arret/suppression de l'ancien conteneur puis lancement du nouveau
            # (docker compose up -d gere deja ce remplacement pour nous)
            docker compose --env-file .env up -d --remove-orphans

            # Nettoyage cible : uniquement les anciennes images non taguees de ce depot
            docker images "${{ vars.IMAGE_NAME }}" -q --filter "dangling=true" | xargs -r docker rmi

      - name: Verification du deploiement (healthcheck)
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://${{ secrets.VPS_HOST }}:${{ vars.HOST_PORT }}/actuator/health; then
              echo "Application prete"
              exit 0
            fi
            echo "Tentative $i/20 - pas encore prete, nouvel essai dans 10s..."
            sleep 10
          done
          echo "L'application n'a jamais repondu apres 200s"
          exit 1

  # ============================================================
  # STAGE 6 - Notification (statut final)
  # ============================================================
  notify:
    name: "6. Notification"
    needs: [build-test, analyze, dockerize-and-push, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Rapport de statut
        run: |
          echo "## Resultat de la pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Etape | Statut |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 1. Build & Test | ${{ needs.build-test.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 2. Analyse de code | ${{ needs.analyze.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 3-4. Dockerisation & Registry | ${{ needs.dockerize-and-push.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 5. Deploiement | ${{ needs.deploy.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Branche : ${{ github.ref_name }} | Declencheur : ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Application deployee :** [http://${{ secrets.VPS_HOST }}:${{ vars.HOST_PORT }}](http://${{ secrets.VPS_HOST }}:${{ vars.HOST_PORT }})" >> "$GITHUB_STEP_SUMMARY"
          fi