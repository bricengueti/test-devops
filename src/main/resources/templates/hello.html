<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Zero to Deploy</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #222;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        .env {
            font-size: 0.95rem;
            color: #666;
        }
        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .dot-test    { background: #2563eb; }
        .dot-preprod { background: #d97706; }
        .dot-prod    { background: #dc2626; }
    </style>
</head>
<body>
<h1>Hello World</h1>
<p class="env">
    <span class="dot" th:classappend="'dot-' + ${#strings.toLowerCase(environment)}"></span>
    <span th:text="${environment}">environnement</span>
</p>
</body>
</html>
